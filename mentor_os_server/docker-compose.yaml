services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mentor_os
      POSTGRES_PASSWORD: "aBTgxiNCq65BAtrU6KykVB5pev_tvlwn"
    volumes:
      - mentor_os_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "ddCXyd8O5HnwJDRr4aG66uM8uY-CQ_ib"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mentor_os_test
      POSTGRES_PASSWORD: "1n4ylam7BCMABamuaPf48qW8dyZePAVt"
    volumes:
      - mentor_os_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "gS5S_2z4DXbFRc_cNrP9OhZm10yThQez"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  mentor_os_data:
  mentor_os_test_data:
